services:
  - type: web
    name: retailpulse-forecast
    runtime: python
    plan: free
    rootDir: forecast_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        value: https://sales-analytics-dashboard-seven-lime.vercel.app,http://localhost:3000
